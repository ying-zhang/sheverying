plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def automationTokenFile = rootProject.file('.automation-token')
def generatedAutomationSource = layout.buildDirectory.file('generated/source/automationToken/com/hamondev/shevery/tasker/GeneratedAutomationToken.java')

tasks.register('generateAutomationToken') {
    inputs.property('automationToken', providers.provider {
        automationTokenFile.exists() ? automationTokenFile.getText('UTF-8').trim() : 'missing'
    })
    outputs.file(generatedAutomationSource)
    doLast {
        if (!automationTokenFile.exists()) {
            byte[] bytes = new byte[16]
            new java.security.SecureRandom().nextBytes(bytes)
            automationTokenFile.text = bytes.collect { String.format('%02x', it & 0xff) }.join('') + System.lineSeparator()
        }
        String token = automationTokenFile.getText('UTF-8').trim()
        if (!(token ==~ /[0-9a-f]{32}/)) {
            throw new GradleException("${automationTokenFile} must contain exactly 32 lowercase hexadecimal characters")
        }
        def output = generatedAutomationSource.get().asFile
        output.parentFile.mkdirs()
        output.setText("package com.hamondev.shevery.tasker;\n\nfinal class GeneratedAutomationToken {\n    static final String VALUE = \"${token}\";\n    private GeneratedAutomationToken() {}\n}\n", 'UTF-8')
    }
}

android.sourceSets.main.java.srcDir(generatedAutomationSource.get().asFile.parentFile.parentFile.parentFile.parentFile.parentFile)
tasks.named('preBuild').configure { dependsOn('generateAutomationToken') }

android {
    namespace 'com.hamondev.shevery.tasker'
    buildFeatures {
        buildConfig = false
        compose = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation project(':api')
    implementation 'androidx.annotation:annotation:1.11.0-alpha01'

    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.5.0-alpha25'
    implementation 'androidx.compose.ui:ui'
}
