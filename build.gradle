plugins {
    id("idea")
}

idea.module {
    excludeDirs += file('out')
}

subprojects {
    plugins.withId("com.android.base") {
        android {
            compileSdk = 37
            buildToolsVersion = "37.0.0"
            ndkVersion = "30.0.16248370"
            defaultConfig {
                minSdk = 30
                targetSdk = 37
                def targetAbi = providers.gradleProperty("targetAbi").orNull
                if (targetAbi != null && !targetAbi.isBlank()) {
                    ndk {
                        abiFilters.add(targetAbi)
                    }
                }
            }
            compileOptions {
                sourceCompatibility = JavaVersion.VERSION_21
                targetCompatibility = JavaVersion.VERSION_21
            }
        }
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

apply from: 'api/manifest.gradle'
def gitCommitId = "dev"
try {
    def commit = 'git rev-parse --short HEAD'.execute([], project.rootDir).text.trim()
    if (!commit.isEmpty()) gitCommitId = commit
} catch (Exception ignored) {}

ext {
    versionCode = release_version_code
    versionName = api_version_name
}
